<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Copilote V16 - Phélypeaux Tonkin Corrigé</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #map {
            flex: 1;
            width: 100%;
            min-height: 35vh;
            z-index: 1;
        }
        #dashboard {
            background-color: #1e293b;
            padding: 14px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
            z-index: 2;
            max-height: 65vh;
            overflow-y: auto;
        }
        
        .route-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .btn-route {
            flex: 1;
            padding: 9px;
            border: 1px solid #475569;
            background: #334155;
            color: #94a3b8;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-size: 0.8rem;
        }
        .btn-route.active {
            background: #0284c7;
            color: white;
            border-color: #38bdf8;
        }

        .sim-container {
            background: #0f172a;
            border: 1px dashed #475569;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .sim-title {
            font-size: 0.7rem;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
        }
        .sim-buttons {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .btn-sim {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-sim:active { background: #0284c7; }

        .btn-audio {
            width: 100%;
            padding: 9px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-audio.muted { background: #dc2626; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .stat-card {
            background: #334155;
            padding: 8px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #475569;
        }
        .stat-card.full {
            grid-column: span 2;
            background: #0f172a;
            border-color: #0284c7;
        }
        .stat-label { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
        .stat-value { font-size: 1.1rem; font-weight: 700; color: #38bdf8; margin-top: 2px; }
        .stat-value.highlight { color: #fef08a; }
        .stat-subtext { font-size: 0.65rem; color: #cbd5e1; margin-top: 2px; }

        .alert-box {
            background-color: #451a03;
            border: 1px solid #b45309;
            border-radius: 10px;
            padding: 8px;
        }
        .alert-title { font-size: 0.75rem; font-weight: 700; color: #fbbf24; margin-bottom: 2px; }
        .alert-text { font-size: 0.7rem; color: #fef3c7; line-height: 1.2; }
        #status-bar { font-size: 0.65rem; text-align: center; color: #64748b; margin-top: 6px; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="map"></div>

    <div id="dashboard">
        <div class="route-selector">
            <button class="btn-route active" id="btn-retour" onclick="setDirection('retour')">🔄 RETOUR (15 Août)</button>
            <button class="btn-route" id="btn-aller" onclick="setDirection('aller')">🚗 ALLER (1er Août)</button>
        </div>

        <div class="sim-container">
            <div class="sim-title">🧪 Simulation Routière</div>
            <div class="sim-buttons" id="sim-buttons-container"></div>
        </div>

        <button class="btn-audio" id="btn-sound" onclick="toggleSound()">
            🔊 Activer les Alertes Vocales
        </button>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Prochaine Étape</div>
                <div class="stat-value" id="etape-timer">-- h --</div>
                <div class="stat-subtext" id="etape-name">Calcul en cours...</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Total Restant</div>
                <div class="stat-value" id="total-timer">-- h --</div>
                <div class="stat-subtext" id="total-dist">-- km routiers</div>
            </div>

            <div class="stat-card full">
                <div class="stat-label">Au volant de ce segment</div>
                <div class="stat-value highlight" id="current-driver">En attente...</div>
                <div class="stat-subtext">Mise à jour automatique par suivi GPS</div>
            </div>
        </div>

        <div class="alert-box">
            <div class="alert-title" id="alert-title">⚠️ CONSIGNES DU TRAJET</div>
            <div class="alert-text" id="alert-text">Prêt pour le guidage.</div>
        </div>

        <div id="status-bar">Système prêt.</div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Coordonnées exactes et corrigées du 1 Rue Phélypeaux (Tonkin / CPE Louis Armand)
    const PHELYPEAUX_LAT = 45.7775; 
    const PHELYPEAUX_LON = 4.8639;
    const LITTEAU_LAT = 49.15774;
    const LITTEAU_LON = -0.92245;

    let routes = {
        aller: {
            name: "Aller : Lyon ➔ Normandie",
            etapes: [
                { id: 1, name: "Départ (1 Rue Phélypeaux, Villeurbanne)", lat: PHELYPEAUX_LAT, lon: PHELYPEAUX_LON, driver: null },
                { id: 2, name: "Aire de Beaune Merceuil", lat: 46.96238, lon: 4.83823, driver: "Lou" }, 
                { id: 3, name: "Aire de Darvault", lat: 48.2636, lon: 2.7242, driver: "Puce" }, 
                { id: 4, name: "Traversée Le Chesnay", lat: 48.825, lon: 2.125, driver: "Lou" }, 
                { id: 5, name: "Aire de Vironvay Nord 🍔 (Pause Midi)", lat: 49.21131, lon: 1.22012, driver: "Lou" }, 
                { id: 6, name: "Arrivée (Camping Domaine du Litteau)", lat: LITTEAU_LAT, lon: LITTEAU_LON, driver: "Lou" } 
            ],
            vigilances: [
                { lat: 48.825, lon: 2.125, distAlert: 5, msg: "Attention ! Traversée par Le Chesnay pour esquiver le Duplex A86 (coffre de toit).", title: "🚫 CONTOURNEMENT DUPLEX A86" },
                { lat: 49.21131, lon: 1.22012, distAlert: 4, msg: "Approche de l'aire de Vironvay Nord. C'est l'heure de la pause midi après Paris !", title: "🍔 PAUSE MIDI" },
                { lat: 46.96238, lon: 4.83823, distAlert: 4, msg: "Approche de l'aire de Beaune Merceuil. Puce prend le volant.", title: "🔄 RELAIS CONDUCTEUR" }
            ]
        },
        retour: {
            name: "Retour : Normandie ➔ Lyon",
            etapes: [
                { id: 1, name: "Départ (Camping Domaine du Litteau)", lat: LITTEAU_LAT, lon: LITTEAU_LON, driver: null },
                { id: 2, name: "Aire de Vironvay Sud 🍔 (Pause Midi)", lat: 49.2121, lon: 1.21765, driver: "Lou" }, 
                { id: 3, name: "Traversée Le Chesnay", lat: 48.825, lon: 2.125, driver: "Lou" }, 
                { id: 4, name: "Aire de Nemours", lat: 48.2617, lon: 2.7221, driver: "Lou" }, 
                { id: 5, name: "Aire de Beaune Tailly", lat: 46.96891, lon: 4.83630, driver: "Puce" }, 
                { id: 6, name: "Arrivée (1 Rue Phélypeaux, Villeurbanne)", lat: PHELYPEAUX_LAT, lon: PHELYPEAUX_LON, driver: "Lou" } 
            ],
            vigilances: [
                { lat: 48.825, lon: 2.125, distAlert: 5, msg: "Attention ! Traversée par Le Chesnay pour esquiver le Duplex A86 (coffre de toit).", title: "🚫 CONTOURNEMENT DUPLEX A86" },
                { lat: 48.2617, lon: 2.7221, distAlert: 4, msg: "Approche de l'aire de Nemours. Relais de conduite, Puce prend le volant.", title: "🔄 RELAIS CONDUCTEUR" },
                { lat: 46.96891, lon: 4.83630, distAlert: 4, msg: "Approche de l'aire de Beaune-Tailly. Dernier relais, Lou reprend le volant.", title: "🔄 RELAIS CONDUCTEUR" },
                { lat: 49.2121, lon: 1.21765, distAlert: 4, msg: "Approche de l'aire de Vironvay Sud. C'est l'heure de la pause midi, avant de traverser Paris !", title: "🍔 PAUSE MIDI" }
            ]
        }
    };

    let currentDirection = 'retour';
    let soundEnabled = false;
    let currentWaypointIndex = 1; 
    
    const map = L.map('map').setView([47.5, 2.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
        attribution: '© OpenStreetMap' 
    }).addTo(map);

    let routeLayerGroup = L.layerGroup().addTo(map);
    let userMarker = null;

    function initApp() {
        setDirection('retour');
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        const btn = document.getElementById('btn-sound');
        if (soundEnabled) {
            btn.innerHTML = "🔊 Alertes Vocales Activées";
            btn.classList.remove('muted');
            speak("Copilote activé.");
        } else {
            btn.innerHTML = "🔇 Alertes Vocales Désactivées";
            btn.classList.add('muted');
        }
    }

    function speak(text) {
        if (!soundEnabled) return;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    }

    function formatTime(seconds) {
        const hoursTotal = seconds / 3600;
        const h = Math.floor(hoursTotal);
        const m = Math.round((hoursTotal - h) * 60);
        return h === 0 ? `${m} min` : `${h}h ${m < 10 ? '0' : ''}${m}`;
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function setDirection(dir) {
        currentDirection = dir;
        currentWaypointIndex = 1; 
        document.getElementById('btn-retour').classList.toggle('active', dir === 'retour');
        document.getElementById('btn-aller').classList.toggle('active', dir === 'aller');
        
        buildSimButtons();
        triggerPositionUpdate(routes[currentDirection].etapes[0].lat, routes[currentDirection].etapes[0].lon, "Départ", 0);
    }

    function buildSimButtons() {
        const container = document.getElementById('sim-buttons-container');
        container.innerHTML = '';
        routes[currentDirection].etapes.forEach((e, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn-sim';
            let shortName = e.name.replace("Aire de ", "").replace(" (Pause Midi)", "").replace("Traversée ", "").replace("Départ (", "").replace("Arrivée (", "").replace(")", "");
            btn.innerText = `📍 ${shortName}`;
            btn.onclick = () => triggerPositionUpdate(e.lat, e.lon, e.name, index);
            container.appendChild(btn);
        });
    }

    async function triggerPositionUpdate(uLat, uLon, locationName, forcedIndex = -1) {
        document.getElementById('status-bar').innerText = `Calcul route depuis: ${locationName}...`;

        if (!userMarker) {
            userMarker = L.circleMarker([uLat, uLon], {
                radius: 10, fillColor: '#22c55e', color: '#ffffff', weight: 3, opacity: 1, fillOpacity: 1
            }).addTo(map);
            map.setView([uLat, uLon], 15);
        } else {
            userMarker.setLatLng([uLat, uLon]);
            map.panTo([uLat, uLon]);
        }

        const etapes = routes[currentDirection].etapes;

        if (forcedIndex !== -1) {
            currentWaypointIndex = forcedIndex + 1;
        } else if (currentWaypointIndex < etapes.length) {
            const distToNext = calcDistance(uLat, uLon, etapes[currentWaypointIndex].lat, etapes[currentWaypointIndex].lon);
            if (distToNext < 3) {
                currentWaypointIndex++;
            }
        }

        if (currentWaypointIndex >= etapes.length) {
            document.getElementById('etape-name').innerText = "Arrivée !";
            document.getElementById('etape-timer').innerText = "0 min";
            document.getElementById('total-dist').innerText = "0 km";
            document.getElementById('total-timer').innerText = "0 min";
            document.getElementById('current-driver').innerText = `🚗 Terminé`;
            routeLayerGroup.clearLayers();
            return;
        }

        let coordsString = `${uLon},${uLat}`;
        for (let i = currentWaypointIndex; i < etapes.length; i++) {
            coordsString += `;${etapes[i].lon},${etapes[i].lat}`;
        }

        const url = `https://router.project-osrm.org/route/v1/driving/${coordsString}?overview=full&geometries=geojson`;

        try {
            const res = await fetch(url);
            const data = await res.json();

            if (data.code === 'Ok' && data.routes.length > 0) {
                const route = data.routes[0];
                
                routeLayerGroup.clearLayers();
                const latLngs = route.geometry.coordinates.map(c => [c[1], c[0]]);
                L.polyline(latLngs, { color: '#38bdf8', weight: 5, opacity: 0.9 }).addTo(routeLayerGroup);

                etapes.forEach(e => {
                    if (e.id > 1 || (currentDirection === 'aller' && e.id === 1)) {
                        let desc = e.driver ? `<br>Conduit par : <b>${e.driver}</b>` : "";
                        L.marker([e.lat, e.lon]).addTo(routeLayerGroup).bindPopup(`<b>${e.name}</b>${desc}`);
                    }
                });

                const totalKm = Math.round(route.distance / 1000);
                const totalDuration = route.duration;
                const nextStep = etapes[currentWaypointIndex];
                
                const legToNext = route.legs[0];

                document.getElementById('etape-name').innerText = `Vers ${nextStep.name}`;
                document.getElementById('etape-timer').innerText = formatTime(legToNext.duration);
                document.getElementById('total-dist').innerText = `${totalKm} km routiers`;
                document.getElementById('total-timer').innerText = formatTime(totalDuration);
                
                if (nextStep.driver) {
                    document.getElementById('current-driver').innerText = `🚗 ${nextStep.driver}`;
                }
                
                document.getElementById('status-bar').innerText = `Itinéraire chargé avec succès`;
            }
        } catch (e) {
            document.getElementById('status-bar').innerText = `Erreur de calcul du réseau routier.`;
        }

        routes[currentDirection].vigilances.forEach((v) => {
            const d = calcDistance(uLat, uLon, v.lat, v.lon);
            if (d <= v.distAlert) {
                document.getElementById('alert-title').innerText = v.title;
                document.getElementById('alert-text').innerText = v.msg;
                speak(`${v.title}. ${v.msg}`);
            }
        });
    }

    initApp();

    let lastGpsLat = null;
    let lastGpsLon = null;
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
            (pos) => {
                const uLat = pos.coords.latitude;
                const uLon = pos.coords.longitude;
                
                let movedEnough = true;
                if (lastGpsLat !== null && lastGpsLon !== null) {
                    const distSinceLast = calcDistance(uLat, uLon, lastGpsLat, lastGpsLon);
                    if (distSinceLast < 1) movedEnough = false;
                }

                if (movedEnough) {
                    lastGpsLat = uLat;
                    lastGpsLon = uLon;
                    triggerPositionUpdate(uLat, uLon, "GPS En mouvement", -1);
                }
            },
            (err) => {},
            { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
        );
    }
</script>

</body>
</html>
