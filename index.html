<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Copilote Trajet Normandie ⇄ Lyon</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #map {
            flex: 1;
            width: 100%;
            min-height: 40vh;
            z-index: 1;
        }
        #dashboard {
            background-color: #1e293b;
            padding: 16px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
            z-index: 2;
            max-height: 60vh;
            overflow-y: auto;
        }
        
        .route-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .btn-route {
            flex: 1;
            padding: 10px;
            border: 1px solid #475569;
            background: #334155;
            color: #94a3b8;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
        }
        .btn-route.active {
            background: #0284c7;
            color: white;
            border-color: #38bdf8;
        }

        .btn-audio {
            width: 100%;
            padding: 10px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-audio.muted {
            background: #dc2626;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .stat-card {
            background: #334155;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #475569;
        }
        .stat-card.full {
            grid-column: span 2;
            background: #0f172a;
            border-color: #0284c7;
        }
        .stat-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
        .stat-value { font-size: 1.2rem; font-weight: 700; color: #38bdf8; margin-top: 2px; }
        .stat-value.highlight { color: #fef08a; }
        .stat-subtext { font-size: 0.7rem; color: #cbd5e1; margin-top: 2px; }

        .alert-box {
            background-color: #451a03;
            border: 1px solid #b45309;
            border-radius: 12px;
            padding: 10px;
        }
        .alert-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 4px;
        }
        .alert-text {
            font-size: 0.75rem;
            color: #fef3c7;
            line-height: 1.3;
        }
        #status-bar {
            font-size: 0.7rem;
            text-align: center;
            color: #64748b;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="map"></div>

    <div id="dashboard">
        <div class="route-selector">
            <button class="btn-route active" id="btn-retour" onclick="setDirection('retour')">🔄 RETOUR (15 Août)</button>
            <button class="btn-route" id="btn-aller" onclick="setDirection('aller')">🚗 ALLER (1er Août)</button>
        </div>

        <button class="btn-audio" id="btn-sound" onclick="toggleSound()">
            🔊 Activer les Alertes Vocales
        </button>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Prochaine Étape</div>
                <div class="stat-value" id="etape-timer">-- h --</div>
                <div class="stat-subtext" id="etape-name">GPS en attente...</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Total Restant</div>
                <div class="stat-value" id="total-timer">-- h --</div>
                <div class="stat-subtext" id="total-dist">-- km</div>
            </div>

            <div class="stat-card full">
                <div class="stat-label">Au volant (Théorie)</div>
                <div class="stat-value highlight" id="current-driver">En attente GPS...</div>
                <div class="stat-subtext">Le conducteur s'actualise à chaque étape franchie</div>
            </div>
        </div>

        <div class="alert-box">
            <div class="alert-title" id="alert-title">⚠️ CONSIGNES DU TRAJET</div>
            <div class="alert-text" id="alert-text">
                Routage strict par les grands axes sans sortie urbaine.
            </div>
        </div>

        <div id="status-bar">GPS : Recherche de signal...</div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Étapes configurées avec des points de passage calés directement sur l'autoroute (A6 / A13)
    const routes = {
        retour: {
            name: "Retour : Normandie ➔ Lyon",
            etapes: [
                { id: 1, name: "Départ (Domaine de Litteau)", lat: 49.155, lon: -0.898, rLat: 49.155, rLon: -0.898, driver: "Laurent" },
                { id: 2, name: "A13, 27400 Vironvay", lat: 49.232, lon: 1.251, rLat: 49.232, rLon: 1.251, driver: "Ton épouse" },
                { id: 3, name: "Contournement A86 (Versailles / N12)", lat: 48.785, lon: 2.030, rLat: 48.785, rLon: 2.030, driver: "Laurent" },
                { id: 4, name: "Aire de Nemours, A6, 77140 Darvault", lat: 48.258, lon: 2.691, rLat: 48.258, rLon: 2.691, driver: "Laurent" },
                { id: 5, name: "Aire de Beaune-Tailly, 21190 Merceuil", lat: 47.009, lon: 4.892, rLat: 47.009, rLon: 4.892, driver: "Ton épouse" },
                { id: 6, name: "Arrivée (Villeurbanne)", lat: 45.764, lon: 4.881, rLat: 45.764, rLon: 4.881, driver: "Laurent" }
            ],
            vigilances: [
                { lat: 48.801, lon: 2.130, distAlert: 5, msg: "Attention ! Approche de Versailles. Ne pas prendre le tunnel Duplex A86 en raison du coffre de toit. Suivre A12 puis N12.", title: "🚫 BIFURCATION DUPLEX A86" },
                { lat: 48.258, lon: 2.691, distAlert: 4, msg: "Approche de l'aire de Nemours sur l'autoroute.", title: "☕ PAUSE AIRE DE NEMOURS" },
                { lat: 47.009, lon: 4.892, distAlert: 4, msg: "Approche de l'aire de Beaune-Tailly sur l'A6.", title: "☕ PAUSE AIRE DE BEAUNE" }
            ]
        },
        aller: {
            name: "Aller : Lyon ➔ Normandie",
            etapes: [
                { id: 1, name: "Départ (Villeurbanne)", lat: 45.764, lon: 4.881, rLat: 45.764, rLon: 4.881, driver: "Laurent" },
                { id: 2, name: "Aire de Beaune-Tailly, 21190 Merceuil", lat: 47.009, lon: 4.892, rLat: 47.009, rLon: 4.892, driver: "Laurent" },
                { id: 3, name: "Aire de Nemours, A6, 77140 Darvault", lat: 48.258, lon: 2.691, rLat: 48.258, rLon: 2.691, driver: "Ton épouse" },
                { id: 4, name: "Contournement A86 (N12 / Versailles)", lat: 48.785, lon: 2.030, rLat: 48.785, rLon: 2.030, driver: "Laurent" },
                { id: 5, name: "A13, 27400 Vironvay", lat: 49.232, lon: 1.251, rLat: 49.232, rLon: 1.251, driver: "Laurent" },
                { id: 6, name: "Arrivée (Domaine de Litteau)", lat: 49.155, lon: -0.898, rLat: 49.155, rLon: -0.898, driver: "Ton épouse" }
            ],
            vigilances: [
                { lat: 48.500, lon: 2.500, distAlert: 5, msg: "Attention ! Contournement de Paris. Quitter l'A10 vers N12 / A12. Éviter absolument le Duplex A86 avec le chargement de toit.", title: "🚫 BIFURCATION DUPLEX A86" },
                { lat: 47.009, lon: 4.892, distAlert: 4, msg: "Approche de l'aire de Beaune-Tailly sur l'A6.", title: "☕ PAUSE AIRE DE BEAUNE" }
            ]
        }
    };

    let currentDirection = 'retour';
    let soundEnabled = false;
    let triggeredAlerts = new Set();

    const map = L.map('map').setView([47.5, 2.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
        attribution: '© OpenStreetMap' 
    }).addTo(map);

    let routeLayerGroup = L.layerGroup().addTo(map);
    let userMarker = null;

    function toggleSound() {
        soundEnabled = !soundEnabled;
        const btn = document.getElementById('btn-sound');
        if (soundEnabled) {
            btn.innerHTML = "🔊 Alertes Vocales Activées";
            btn.classList.remove('muted');
            speak("Le copilote vocal est activé pour la route.");
        } else {
            btn.innerHTML = "🔇 Alertes Vocales Désactivées";
            btn.classList.add('muted');
        }
    }

    function speak(text) {
        if (!soundEnabled) return;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    }

    function setDirection(dir) {
        currentDirection = dir;
        triggeredAlerts.clear();

        document.getElementById('btn-retour').classList.toggle('active', dir === 'retour');
        document.getElementById('btn-aller').classList.toggle('active', dir === 'aller');

        renderMapRoute();
        
        let msgDirection = dir === 'retour' ? 'vers Lyon' : 'vers la Normandie';
        speak(`Trajet ${msgDirection} sélectionné.`);
    }

    async function renderMapRoute() {
        routeLayerGroup.clearLayers();
        const routeData = routes[currentDirection];

        routeData.etapes.forEach((e) => {
            L.marker([e.lat, e.lon]).addTo(routeLayerGroup).bindPopup(`<b>${e.name}</b><br>Conducteur prévu : ${e.driver}`);
        });

        const coordString = routeData.etapes.map(e => `${e.rLon},${e.rLat}`).join(';');
        const url = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            if (data.code === 'Ok') {
                const roadCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                L.polyline(roadCoords, { color: '#38bdf8', weight: 5, opacity: 0.9 }).addTo(routeLayerGroup);
            } else {
                fallbackPolyline(routeData.etapes);
            }
        } catch (err) {
            fallbackPolyline(routeData.etapes);
        }
    }

    function fallbackPolyline(etapes) {
        const points = etapes.map(e => [e.lat, e.lon]);
        L.polyline(points, { color: '#38bdf8', weight: 4, opacity: 0.8, dashArray: '6, 6' }).addTo(routeLayerGroup);
    }

    renderMapRoute();

    function calcDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function formatTime(distanceKm, speedKmH = 95) {
        const hoursTotal = distanceKm / speedKmH;
        const h = Math.floor(hoursTotal);
        const m = Math.round((hoursTotal - h) * 60);
        return h === 0 ? `${m} min` : `${h}h ${m < 10 ? '0' : ''}${m}`;
    }

    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
            (pos) => {
                const uLat = pos.coords.latitude;
                const uLon = pos.coords.longitude;
                document.getElementById('status-bar').innerText = `GPS Connecté (Précision: ${Math.round(pos.coords.accuracy)}m)`;

                if (!userMarker) {
                    userMarker = L.circleMarker([uLat, uLon], {
                        radius: 9, fillColor: '#22c55e', color: '#ffffff', weight: 3, opacity: 1, fillOpacity: 1
                    }).addTo(map);
                    map.setView([uLat, uLon], 8);
                } else {
                    userMarker.setLatLng([uLat, uLon]);
                }

                const routeData = routes[currentDirection];
                const destFinale = routeData.etapes[routeData.etapes.length - 1];

                let nextStep = routeData.etapes.find(e => calcDistance(uLat, uLon, e.lat, e.lon) > 3) || destFinale;
                const distNext = calcDistance(uLat, uLon, nextStep.lat, nextStep.lon);
                
                const distTotalStraight = calcDistance(uLat, uLon, destFinale.lat, destFinale.lon);
                const distTotalRoad = distTotalStraight * 1.25;

                document.getElementById('etape-name').innerText = `Vers ${nextStep.name}`;
                document.getElementById('etape-timer').innerText = formatTime(distNext);
                document.getElementById('total-dist').innerText = `${Math.round(distTotalRoad)} km restant(s)`;
                document.getElementById('total-timer').innerText = formatTime(distTotalRoad);

                if (nextStep.driver) {
                    document.getElementById('current-driver').innerText = `🚗 ${nextStep.driver}`;
                }

                routeData.vigilances.forEach((v, idx) => {
                    const d = calcDistance(uLat, uLon, v.lat, v.lon);
                    if (d <= v.distAlert && !triggeredAlerts.has(`${currentDirection}_${idx}`)) {
                        triggeredAlerts.add(`${currentDirection}_${idx}`);
                        
                        document.getElementById('alert-title').innerText = v.title;
                        document.getElementById('alert-text').innerText = v.msg;
                        
                        speak(`${v.title}. ${v.msg}`);
                    }
                });
            },
            (err) => {
                document.getElementById('status-bar').innerText = "⚠️ Activez la géolocalisation sur votre smartphone.";
            },
            { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
        );
    }
</script>

</body>
</html>
